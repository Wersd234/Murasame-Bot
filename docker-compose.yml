version: '3.8'

services:
  murasame-bot:
    build: .
    container_name: murasame_bot
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=Australia/Melbourne
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
    volumes:
      - /home/serveradmin/murasame-bot/server_settings.json:/app/properties/server_settings.json