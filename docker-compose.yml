version: '3.8'

services:
  murasame-bot:
    build: .
    container_name: murasame_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Australia/Melbourne
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./properties:/app/properties
      - ./resource:/app/resource